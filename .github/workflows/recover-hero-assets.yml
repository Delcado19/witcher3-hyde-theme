name: Recover Hero originals
on:
  push:
    branches:
      - recover-hero-originals-2026-09-19
    paths:
      - '.recovery/**'
      - '.github/workflows/recover-hero-assets.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct and verify exact PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          out="design/icons/reviews/hero/recovered-2026-09-19"
          mkdir -p "$out"
          cat .recovery/dolphin/*.b64 | tr -d '\n\r\t ' | base64 -d > "$out/dolphin-master-recovered.png"
          cat .recovery/kitty/*.b64   | tr -d '\n\r\t ' | base64 -d > "$out/kitty-terminal-master-recovered.png"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct

          checks = {
              "design/icons/reviews/hero/recovered-2026-09-19/dolphin-master-recovered.png": {
                  "bytes": 3375896,
                  "sha256": "20b5f4621a76729049c9e40130c4e04ea6a0fb128d8d21990ce82eee61771032",
                  "gitsha1": "e89a3d55bc6189cf712c1bb6376650fca695a1e6",
                  "dims": (1254, 1254),
              },
              "design/icons/reviews/hero/recovered-2026-09-19/kitty-terminal-master-recovered.png": {
                  "bytes": 3270951,
                  "sha256": "20a661ee327033ece5b43100f3b50050b215243a6e9264602d56448dac4f3f36",
                  "gitsha1": "71cbcdf7a57b5f0ae7261846dc7859d24dd08707",
                  "dims": (1254, 1254),
              },
          }

          for name, exp in checks.items():
              b = Path(name).read_bytes()
              assert len(b) == exp["bytes"], (name, len(b), exp["bytes"])
              assert hashlib.sha256(b).hexdigest() == exp["sha256"], name
              gitsha = hashlib.sha1(f"blob {len(b)}\0".encode() + b).hexdigest()
              assert gitsha == exp["gitsha1"], (name, gitsha, exp["gitsha1"])
              assert b[:8] == b"\x89PNG\r\n\x1a\n", name
              dims = struct.unpack(">II", b[16:24])
              assert dims == exp["dims"], (name, dims, exp["dims"])
              print(f"VERIFIED {name}: bytes={len(b)} sha256={exp['sha256']} gitsha1={gitsha} dims={dims}")
          PY

      - name: Write recovery manifest
        shell: bash
        run: |
          cat > design/icons/reviews/hero/recovered-2026-09-19/RECOVERY_MANIFEST.md <<'EOF'
          # Recovered Hero originals — 2026-09-19

          Exact conversation-upload snapshots recovered and verified before commit.

          ## Dolphin
          - File: `dolphin-master-recovered.png`
          - Original upload: `Düsteres Delphin-Medaillon mit Runen.png`
          - Dimensions: 1254×1254 RGBA
          - Bytes: 3,375,896
          - SHA-256: `20b5f4621a76729049c9e40130c4e04ea6a0fb128d8d21990ce82eee61771032`
          - Git blob SHA-1: `e89a3d55bc6189cf712c1bb6376650fca695a1e6`

          ## Kitty
          - File: `kitty-terminal-master-recovered.png`
          - Original upload: `Düsteres Katzen-Terminal-Emblem.png`
          - Dimensions: 1254×1254 RGBA
          - Bytes: 3,270,951
          - SHA-256: `20a661ee327033ece5b43100f3b50050b215243a6e9264602d56448dac4f3f36`
          - Git blob SHA-1: `71cbcdf7a57b5f0ae7261846dc7859d24dd08707`
          EOF

      - name: Commit recovered originals and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery
          rm -f .github/workflows/recover-hero-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover verified Dolphin and Kitty Hero masters"
          git push origin HEAD:${{ github.ref_name }}
