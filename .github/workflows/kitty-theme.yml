name: Kitty Theme Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "Configs/.config/hyde/themes/Witcher3/kitty.theme"
      - ".github/workflows/kitty-theme.yml"

permissions:
  contents: read

env:
  KITTY_VERSION: "0.48.2"
  KITTY_LINUX_X86_64_SHA256: "967a1958e7fc67b495d279c0963bcd1a0482097151817ce6506fabc822689af7"

jobs:
  validate-kitty-theme:
    name: Parse Witcher3 Kitty theme
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Kitty binary bundle
        run: |
          set -Eeuo pipefail

          archive="$RUNNER_TEMP/kitty.txz"
          install_dir="$RUNNER_TEMP/kitty-app"
          url="https://github.com/kovidgoyal/kitty/releases/download/v${KITTY_VERSION}/kitty-${KITTY_VERSION}-x86_64.txz"

          curl --fail --location --silent --show-error \
            "$url" \
            --output "$archive"

          printf '%s  %s\n' "$KITTY_LINUX_X86_64_SHA256" "$archive" | sha256sum --check --status

          mkdir -p "$install_dir"
          tar -xJf "$archive" -C "$install_dir"

          kitty_bin="$install_dir/bin/kitty"
          test -x "$kitty_bin"
          "$kitty_bin" --version | grep -F "kitty ${KITTY_VERSION}"

      - name: Validate HyDE theme fragment with Kitty parser
        run: |
          set -Eeuo pipefail

          source_theme="Configs/.config/hyde/themes/Witcher3/kitty.theme"
          target_line='$HOME/.config/kitty/theme.conf|killall -SIGUSR1 kitty'
          fragment="$RUNNER_TEMP/Witcher3-kitty.conf"
          kitty_bin="$RUNNER_TEMP/kitty-app/bin/kitty"

          test "$(head -n 1 "$source_theme")" = "$target_line"
          tail -n +2 "$source_theme" > "$fragment"
          test -s "$fragment"

          for key in \
            foreground \
            background \
            selection_foreground \
            selection_background \
            cursor \
            cursor_text_color \
            url_color \
            active_border_color \
            inactive_border_color \
            bell_border_color \
            active_tab_foreground \
            active_tab_background \
            inactive_tab_foreground \
            inactive_tab_background \
            tab_bar_background \
            mark1_foreground \
            mark1_background \
            mark2_foreground \
            mark2_background \
            mark3_foreground \
            mark3_background; do
            grep -Eq "^[[:space:]]*${key}[[:space:]]+" "$fragment"
          done

          for index in $(seq 0 15); do
            grep -Eq "^[[:space:]]*color${index}[[:space:]]+" "$fragment"
          done

          grep -Eq '^[[:space:]]*foreground[[:space:]]+#DEE6F0[[:space:]]*$' "$fragment"
          grep -Eq '^[[:space:]]*background[[:space:]]+#0A151E[[:space:]]*$' "$fragment"
          grep -Eq '^[[:space:]]*active_border_color[[:space:]]+#B72A18[[:space:]]*$' "$fragment"

          KITTY_THEME_FRAGMENT="$fragment" "$kitty_bin" +runpy '
          import os
          import sys
          from kitty.config import load_config

          bad_lines = []
          load_config(os.environ["KITTY_THEME_FRAGMENT"], accumulate_bad_lines=bad_lines)

          if bad_lines:
              print("Kitty rejected configuration lines:", file=sys.stderr)
              for item in bad_lines:
                  print(item, file=sys.stderr)
              raise SystemExit(1)

          print("Kitty parser accepted Witcher3 theme fragment.")
          '

          echo "Witcher3 Kitty theme validation passed with Kitty ${KITTY_VERSION}."
