name: Kvantum Theme Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "Configs/.config/hyde/themes/Witcher3/theme.dcol"
      - "Configs/.config/hyde/themes/Witcher3/kvantum/kvconfig.theme"
      - ".github/workflows/kvantum-theme.yml"

permissions:
  contents: read

env:
  HYDE_COMMIT: 51b6cbf55b0bf982b2ea88af00a0cdbae0c787c7

jobs:
  validate-kvantum-theme:
    name: Render Witcher3 Kvantum theme
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch pinned HyDE Kvantum SVG template
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/HyDE-Project/HyDE/$HYDE_COMMIT/Configs/.local/share/wallbash/theme/kvantum/kvantum.dcol" \
            --output "$RUNNER_TEMP/kvantum.dcol"
          test -s "$RUNNER_TEMP/kvantum.dcol"

      - name: Render and validate Kvantum files
        run: |
          set -Eeuo pipefail

          D_COL="Configs/.config/hyde/themes/Witcher3/theme.dcol" \
          KV_CONFIG="Configs/.config/hyde/themes/Witcher3/kvantum/kvconfig.theme" \
          KV_SVG="$RUNNER_TEMP/kvantum.dcol" \
          python3 <<'PY'
          import configparser
          import math
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          dcol_path = Path(os.environ["D_COL"])
          config_path = Path(os.environ["KV_CONFIG"])
          svg_path = Path(os.environ["KV_SVG"])

          assignment_re = re.compile(r'([A-Za-z0-9_]+)="(.*)"')
          palette = {}
          for line in dcol_path.read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              match = assignment_re.fullmatch(stripped)
              if match:
                  palette[match.group(1)] = match.group(2)

          def replace_wallbash(text: str) -> str:
              def raw(match: re.Match[str]) -> str:
                  token = match.group(1)
                  key = "dcol_" + token
                  if key not in palette:
                      raise SystemExit(f"No palette value for <wallbash_{token}>")
                  return palette[key]

              rendered = re.sub(
                  r"<wallbash_((?:pry|txt)[1-4]|[1-4]xa[1-9])>",
                  raw,
                  text,
              )
              if "<wallbash_" in rendered:
                  unresolved = sorted(set(re.findall(r"<wallbash_[^>]+>", rendered)))
                  raise SystemExit("Unresolved Wallbash tokens: " + ", ".join(unresolved))
              return rendered

          config_lines = config_path.read_text(encoding="utf-8").splitlines()
          expected_target = "$HOME/.config/Kvantum/wallbash/wallbash.kvconfig"
          if not config_lines or config_lines[0] != expected_target:
              raise SystemExit("Unexpected kvconfig.theme target line")

          rendered_config = replace_wallbash("\n".join(config_lines[1:]) + "\n")
          rendered_config_path = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "wallbash.kvconfig"
          rendered_config_path.write_text(rendered_config, encoding="utf-8")

          parser = configparser.ConfigParser(interpolation=None, strict=True)
          parser.optionxform = str
          parser.read_string(rendered_config)

          if "%General" not in parser or "GeneralColors" not in parser:
              raise SystemExit("Required Kvantum sections are missing")

          colors = parser["GeneralColors"]
          expected_colors = {
              "window.color": "#0A151E",
              "base.color": "#101318",
              "highlight.color": "#B72A18",
              "inactive.highlight.color": "#A32716",
              "highlight.text.color": "#DEE6F0",
              "link.color": "#3188A6",
              "link.visited.color": "#743874",
          }
          for key, expected in expected_colors.items():
              actual = colors.get(key)
              if actual != expected:
                  raise SystemExit(f"{key}: expected {expected}, got {actual}")

          def relative_luminance(hex_color: str) -> float:
              raw = hex_color.removeprefix("#")
              channels = [int(raw[i:i + 2], 16) / 255 for i in (0, 2, 4)]
              linear = [
                  c / 12.92 if c <= 0.04045 else ((c + 0.055) / 1.055) ** 2.4
                  for c in channels
              ]
              return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2]

          def contrast_ratio(a: str, b: str) -> float:
              l1, l2 = sorted(
                  (relative_luminance(a), relative_luminance(b)), reverse=True
              )
              return (l1 + 0.05) / (l2 + 0.05)

          ratio = contrast_ratio(
              colors["highlight.color"], colors["highlight.text.color"]
          )
          if ratio < 4.5:
              raise SystemExit(f"Selection contrast too low: {ratio:.2f}:1")

          svg_lines = svg_path.read_text(encoding="utf-8").splitlines()
          expected_svg_target = "$HOME/.config/Kvantum/wallbash/wallbash.svg"
          if not svg_lines or svg_lines[0] != expected_svg_target:
              raise SystemExit("Unexpected HyDE kvantum.dcol target line")

          rendered_svg = replace_wallbash("\n".join(svg_lines[1:]) + "\n")
          ET.fromstring(rendered_svg)

          if "#B72A18" not in rendered_svg:
              raise SystemExit("Rendered HyDE Kvantum SVG does not contain Witcher red")
          if "#0A151E" not in rendered_svg:
              raise SystemExit("Rendered HyDE Kvantum SVG does not contain Witcher canvas")

          print(f"Kvantum selection contrast: {ratio:.2f}:1")
          print("Witcher3 Kvantum config and pinned HyDE SVG rendered successfully.")
          PY
