name: Migrate swww to awww

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/migrate-swww-to-awww.yml"

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    name: Migrate W3-210 canonical to awww
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify awww in pinned Arch command snapshot
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("design/icons/standards/arch-command-names-2026-09-14.csv")
          with path.open("r", encoding="utf-8", newline="") as handle:
              commands = {row["command"].strip() for row in csv.DictReader(handle)}

          if "awww" not in commands:
              raise SystemExit("Pinned Arch command snapshot does not contain 'awww'")

          print("Verified 'awww' in pinned Arch command snapshot.")
          PY

      - name: Migrate W3-210 canonical and preserve legacy alias
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("design/icons/matrix/witcher-icon-matrix-v1.csv")
          with path.open("r", encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames
              rows = [dict(row) for row in reader]

          matches = [row for row in rows if row["id"].strip() == "W3-210"]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one W3-210 row, found {len(matches)}")

          row = matches[0]
          if row["canonical_name"].strip() != "swww":
              raise SystemExit(
                  f"Expected W3-210 canonical 'swww', found {row['canonical_name']!r}"
              )

          aliases = [item.strip() for item in row["aliases"].split(";") if item.strip()]
          row["canonical_name"] = "awww"
          if "swww" not in aliases:
              aliases.append("swww")
          row["aliases"] = "; ".join(aliases)

          with path.open("w", encoding="utf-8", newline="") as handle:
              handle.write("\ufeff")
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY

          python3 tools/normalize-icon-matrix.py --write

      - name: Remove resolved W3-210 provenance row
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("design/icons/standards/application-provenance-review.csv")
          with path.open("r", encoding="utf-8", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames
              rows = [dict(row) for row in reader]

          matches = [row for row in rows if row["id"].strip() == "W3-210"]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one W3-210 provenance row, found {len(matches)}"
              )
          if matches[0]["status"].strip() != "needs-canonical-review":
              raise SystemExit(
                  "W3-210 provenance row no longer has needs-canonical-review status"
              )

          rows = [row for row in rows if row["id"].strip() != "W3-210"]
          with path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Update pinned Stage F and G coverage
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one occurrence in {path}: {old!r}; found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8", newline="")

          stage_f = Path("tools/audit-arch-command-names.py")
          replace_once(
              stage_f,
              "EXPECTED_CANONICAL_COMMAND_ROWS = 15",
              "EXPECTED_CANONICAL_COMMAND_ROWS = 16",
          )
          replace_once(stage_f, "EXPECTED_RESOLVED_ROWS = 17", "EXPECTED_RESOLVED_ROWS = 18")
          replace_once(stage_f, "EXPECTED_UNRESOLVED_ROWS = 29", "EXPECTED_UNRESOLVED_ROWS = 28")
          replace_once(stage_f, "EXPECTED_COMBINED_ROWS = 191", "EXPECTED_COMBINED_ROWS = 192")
          replace_once(
              stage_f,
              '    "W3-209",\n    "W3-219",',
              '    "W3-209",\n    "W3-210",\n    "W3-219",',
          )

          stage_g = Path("tools/audit-application-provenance.py")
          replace_once(
              stage_g,
              "EXPECTED_PROVENANCE_ROWS = 29",
              "EXPECTED_PROVENANCE_ROWS = 28",
          )
          PY

      - name: Validate migration before commit
        run: |
          set -Eeuo pipefail
          python3 tools/normalize-icon-matrix.py
          python3 tools/validate-icon-matrix.py
          python3 tools/audit-freedesktop-icon-names.py
          python3 tools/audit-flathub-app-ids.py
          python3 tools/audit-arch-desktop-ids.py
          python3 tools/audit-arch-command-names.py
          python3 tools/audit-application-provenance.py

      - name: Verify exact migration result
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          matrix = Path("design/icons/matrix/witcher-icon-matrix-v1.csv")
          with matrix.open("r", encoding="utf-8-sig", newline="") as handle:
              rows = {row["id"].strip(): row for row in csv.DictReader(handle)}

          row = rows["W3-210"]
          aliases = {item.strip() for item in row["aliases"].split(";") if item.strip()}
          if row["canonical_name"].strip() != "awww":
              raise SystemExit("W3-210 canonical is not 'awww' after migration")
          if "swww" not in aliases:
              raise SystemExit("W3-210 does not preserve 'swww' as compatibility alias")

          provenance = Path("design/icons/standards/application-provenance-review.csv")
          with provenance.open("r", encoding="utf-8", newline="") as handle:
              provenance_ids = {row["id"].strip() for row in csv.DictReader(handle)}
          if "W3-210" in provenance_ids:
              raise SystemExit("W3-210 still appears in provenance review after migration")

          print("Verified W3-210: canonical awww, legacy alias swww, no stale review row.")
          PY

      - name: Verify change scope
        run: |
          set -Eeuo pipefail
          git status --short
          paths="$(git status --porcelain | sed 's/^...//' | LC_ALL=C sort -u)"
          expected="$(printf '%s\n' \
            design/icons/matrix/witcher-icon-matrix-v1.csv \
            design/icons/matrix/witcher-icon-matrix-v1.md \
            design/icons/standards/application-provenance-review.csv \
            tools/audit-application-provenance.py \
            tools/audit-arch-command-names.py \
            | LC_ALL=C sort -u)"
          if [[ "$paths" != "$expected" ]]; then
            echo "Unexpected migration scope:" >&2
            printf '%s\n' "$paths" >&2
            exit 1
          fi

      - name: Commit awww canonical migration
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            design/icons/matrix/witcher-icon-matrix-v1.csv \
            design/icons/matrix/witcher-icon-matrix-v1.md \
            design/icons/standards/application-provenance-review.csv \
            tools/audit-application-provenance.py \
            tools/audit-arch-command-names.py
          git commit -m "Migrate swww icon canonical to awww"
          git push origin HEAD:main

      - name: Dispatch full icon validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/icon-matrix.yml/dispatches" \
            --data '{"ref":"main"}'
