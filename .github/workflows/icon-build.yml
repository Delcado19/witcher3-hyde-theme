name: Icon Build Validation

on:
  push:
    paths:
      - 'design/icons/matrix/**'
      - 'design/icons/src/**'
      - 'docs/ICON_BUILD.md'
      - 'tools/build-icons.py'
      - 'tools/validate-icon-sources.py'
      - 'tools/build-icon-review.py'
      - 'tools/build-hybrid-icon-review.py'
      - 'tools/generate-hybrid-pilot-dolphin.py'
      - 'tools/generate-hybrid-pilot-kitty.py'
      - 'tools/reconstruct-hero-svg.py'
      - 'tests/test_hero_svg_reconstruction.py'
      - 'design/icons/HYBRID_CROSSOVER_PILOT.md'
      - 'tests/test_build_icons.py'
      - 'tests/test_icon_review.py'
      - 'tests/test_hybrid_icon_review.py'
      - '.github/workflows/icon-build.yml'
  pull_request:
    paths:
      - 'design/icons/matrix/**'
      - 'design/icons/src/**'
      - 'docs/ICON_BUILD.md'
      - 'tools/build-icons.py'
      - 'tools/validate-icon-sources.py'
      - 'tools/build-icon-review.py'
      - 'tools/build-hybrid-icon-review.py'
      - 'tools/generate-hybrid-pilot-dolphin.py'
      - 'tools/generate-hybrid-pilot-kitty.py'
      - 'design/icons/HYBRID_CROSSOVER_PILOT.md'
      - 'tests/test_build_icons.py'
      - 'tests/test_icon_review.py'
      - 'tests/test_hybrid_icon_review.py'
      - '.github/workflows/icon-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate strict icon builder
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Python version
        run: python3 --version

      - name: Compile builder, source validator, and tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            tools/build-icons.py \
            tools/validate-icon-sources.py \
            tools/build-icon-review.py \
            tools/build-hybrid-icon-review.py \
            tools/generate-hybrid-pilot-dolphin.py \
            tools/generate-hybrid-pilot-kitty.py \
            tools/reconstruct-hero-svg.py \
            tests/test_build_icons.py \
            tests/test_icon_review.py \
            tests/test_hybrid_icon_review.py \
            tests/test_hero_svg_reconstruction.py

      - name: Validate repository artwork incrementally
        run: |
          set -Eeuo pipefail
          python3 tools/validate-icon-sources.py

      - name: Validate complete 14-icon pilot
        run: |
          set -Eeuo pipefail
          python3 tools/build-icon-review.py --require-all \
            --output "$RUNNER_TEMP/pilot-review.html"

      - name: Run icon tooling fixture suite
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v tests/test_build_icons.py tests/test_icon_review.py tests/test_hybrid_icon_review.py tests/test_hero_svg_reconstruction.py

      - name: Verify tests left no release artifact
        run: |
          set -Eeuo pipefail
          test ! -e Source/arcs/Icon_Witcher3-HyDE.tar.xz
          git status --short
          test -z "$(git status --porcelain --untracked-files=no)"
