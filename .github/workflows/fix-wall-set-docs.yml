name: Correct wall.set runtime documentation

on:
  push:
    paths:
      - '.github/workflows/fix-wall-set-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch README to match current HyDE wall.set behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '│                   ├── wall.set\n': '',
              '`wall.set`, the wallpaper files, actual icon artwork, screenshots, and optional cursor resources are target-state entries and may not exist yet during development. Icon build and validation tooling already exists and is CI-tested independently of the unfinished artwork set.':
                  'The wallpaper files, actual icon artwork, screenshots, and optional cursor resources are target-state entries and may not exist yet during development. `wall.set` is runtime state created by current HyDE and is intentionally not stored in the repository. Icon build and validation tooling already exists and is CI-tested independently of the unfinished artwork set.',
              '6. Add at least one project-owned or redistributable wallpaper.\n7. Set the deterministic default `wall.set`.\n8. Produce and package the dedicated icon artwork through the validated builder.\n9. Decide whether a custom cursor package is justified.\n10. Test the complete theme on a clean/current HyDE installation before release.':
                  '6. Add at least one project-owned or redistributable wallpaper. Current HyDE creates `wall.set` as runtime state when the theme is applied.\n7. Produce and package the dedicated icon artwork through the validated builder.\n8. Decide whether a custom cursor package is justified.\n9. Test the complete theme on a clean/current HyDE installation before release.',
              '- [ ] Add the first project-owned or redistributable wallpaper\n- [ ] Select the default wallpaper and add `wall.set`':
                  '- [ ] Add the first project-owned or redistributable wallpaper\n- [x] Document `wall.set` as HyDE-managed runtime state rather than a repository asset',
          }

          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

          grep -Fq '`wall.set` is runtime state created by current HyDE' README.md
          ! grep -Fq '├── wall.set' README.md
          ! grep -Fq 'Set the deterministic default `wall.set`' README.md

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/fix-wall-set-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/fix-wall-set-docs.yml
          git diff --cached --check
          git commit -m 'Document HyDE-managed wall.set runtime state'
          git push origin HEAD:main
