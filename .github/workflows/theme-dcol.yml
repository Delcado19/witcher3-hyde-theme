name: Wallbash Palette Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "Configs/.config/hyde/themes/Witcher3/theme.dcol"
      - ".github/workflows/theme-dcol.yml"

permissions:
  contents: read

jobs:
  validate-theme-dcol:
    name: Validate Witcher3 theme.dcol
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate palette structure and RGB pairs
        run: |
          set -Eeuo pipefail

          palette="Configs/.config/hyde/themes/Witcher3/theme.dcol"
          bash -n "$palette"

          PALETTE_PATH="$palette" python3 <<'PY'
          import re
          import subprocess
          from pathlib import Path

          path = Path(__import__("os").environ["PALETTE_PATH"])
          text = path.read_text(encoding="utf-8")

          assignments = {}
          for line in text.splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              match = re.fullmatch(r'([A-Za-z0-9_]+)="(.*)"', stripped)
              if not match:
                  raise SystemExit(f"Unsupported theme.dcol line: {line!r}")
              assignments[match.group(1)] = match.group(2)

          if assignments.get("dcol_mode") != "dark":
              raise SystemExit("dcol_mode must be dark")

          required = []
          for group in range(1, 5):
              required.extend((
                  f"dcol_pry{group}",
                  f"dcol_pry{group}_rgba",
                  f"dcol_txt{group}",
                  f"dcol_txt{group}_rgba",
              ))
              for slot in range(1, 10):
                  required.extend((
                      f"dcol_{group}xa{slot}",
                      f"dcol_{group}xa{slot}_rgba",
                  ))

          missing = [key for key in required if key not in assignments]
          if missing:
              raise SystemExit("Missing palette variables: " + ", ".join(missing))

          extras = sorted(
              key for key in assignments
              if key != "dcol_mode" and key not in required
          )
          if extras:
              raise SystemExit("Unexpected palette variables: " + ", ".join(extras))

          hex_re = re.compile(r"[0-9A-F]{6}")
          rgba_re = re.compile(r"rgba\((\d+),(\d+),(\d+),\\1\)")

          for key in required:
              if key.endswith("_rgba"):
                  continue

              value = assignments[key]
              if not hex_re.fullmatch(value):
                  raise SystemExit(f"{key} is not uppercase RRGGBB: {value}")

              rgba_key = key + "_rgba"
              rgba_value = assignments[rgba_key]
              match = rgba_re.fullmatch(rgba_value)
              if not match:
                  raise SystemExit(f"{rgba_key} has invalid format: {rgba_value}")

              expected = tuple(int(value[index:index + 2], 16) for index in (0, 2, 4))
              actual = tuple(map(int, match.groups()))
              if actual != expected:
                  raise SystemExit(
                      f"{rgba_key} mismatch: {actual} != {expected} for {value}"
                  )

          expected_roles = {
              "dcol_pry1": "0A151E",
              "dcol_pry2": "171A1C",
              "dcol_pry3": "262729",
              "dcol_pry4": "B72A18",
              "dcol_txt1": "DEE6F0",
              "dcol_txt4": "DEE6F0",
              "dcol_1xa6": "D58E4D",
              "dcol_1xa7": "3188A6",
              "dcol_2xa7": "3DB479",
              "dcol_3xa6": "8E8B8D",
              "dcol_3xa7": "3188A6",
              "dcol_4xa8": "B72A18",
          }
          for key, expected in expected_roles.items():
              actual = assignments.get(key)
              if actual != expected:
                  raise SystemExit(f"{key}: expected {expected}, got {actual}")

          print(f"Validated {len(required) // 2} colors and their RGBA pairs.")
          PY
