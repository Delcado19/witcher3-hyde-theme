name: Icon Matrix Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "design/icons/matrix/witcher-icon-matrix-v1.csv"
      - "design/icons/matrix/witcher-icon-matrix-v1.md"
      - "design/icons/standards/freedesktop-icon-naming-latest-2026-09-14.csv"
      - "design/icons/standards/freedesktop-context-exceptions.csv"
      - "design/icons/standards/flathub-app-ids-2026-09-14.csv"
      - "design/icons/standards/arch-desktop-ids-2026-09-14.csv"
      - "design/icons/standards/arch-command-names-2026-09-14.csv"
      - "design/icons/standards/application-provenance-review.csv"
      - "tools/validate-icon-matrix.py"
      - "tools/normalize-icon-matrix.py"
      - "tools/audit-freedesktop-icon-names.py"
      - "tools/audit-shared-mime-info.py"
      - "tools/audit-breeze-icon-names.py"
      - "tools/audit-flathub-app-ids.py"
      - "tools/audit-arch-desktop-ids.py"
      - "tools/audit-arch-command-names.py"
      - "tools/audit-application-provenance.py"
      - ".github/workflows/icon-matrix.yml"

permissions:
  contents: read

env:
  BREEZE_COMMIT: 235730e69d90949621e4fee77fcc459772b7a8f0
  SHARED_MIME_TAG: "2.5.1"
  SHARED_MIME_COMMIT_PREFIX: fd8ab89c20

jobs:
  validate-icon-matrix:
    name: Validate 645-design icon matrix
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate matrix structure and namespaces
        run: |
          set -Eeuo pipefail
          python3 tools/validate-icon-matrix.py

      - name: Verify normalized CSV and Markdown mirror
        run: |
          set -Eeuo pipefail
          python3 tools/normalize-icon-matrix.py

      - name: Audit Freedesktop standard names and contexts
        run: |
          set -Eeuo pipefail
          python3 tools/audit-freedesktop-icon-names.py

      - name: Fetch pinned Freedesktop shared-mime-info source
        run: |
          set -Eeuo pipefail

          shared_repo="$RUNNER_TEMP/shared-mime-info"
          shared_xml="$RUNNER_TEMP/shared-mime-info.xml"

          git init --quiet "$shared_repo"
          git -C "$shared_repo" remote add origin \
            https://gitlab.freedesktop.org/xdg/shared-mime-info.git
          git -C "$shared_repo" fetch --quiet --depth=1 origin \
            "refs/tags/$SHARED_MIME_TAG"

          actual_commit="$(git -C "$shared_repo" rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$actual_commit" != "$SHARED_MIME_COMMIT_PREFIX"* ]]; then
            echo "Expected shared-mime-info $SHARED_MIME_TAG at ${SHARED_MIME_COMMIT_PREFIX}..., fetched $actual_commit" >&2
            exit 1
          fi

          git -C "$shared_repo" show \
            "FETCH_HEAD:data/freedesktop.org.xml.in" > "$shared_xml"
          test -s "$shared_xml"

      - name: Audit shared-mime-info specific icon names
        run: |
          set -Eeuo pipefail
          python3 tools/audit-shared-mime-info.py \
            --source-xml "$RUNNER_TEMP/shared-mime-info.xml" \
            --resolved-output "$RUNNER_TEMP/shared-mime-resolved.txt"

      - name: Fetch pinned KDE Breeze icon tree
        run: |
          set -Eeuo pipefail

          breeze_repo="$RUNNER_TEMP/breeze-icons"
          breeze_tree="$RUNNER_TEMP/breeze-tree.txt"

          git init --quiet "$breeze_repo"
          git -C "$breeze_repo" remote add origin https://github.com/KDE/breeze-icons.git
          git -C "$breeze_repo" fetch --quiet --depth=1 origin "$BREEZE_COMMIT"

          actual_commit="$(git -C "$breeze_repo" rev-parse FETCH_HEAD)"
          if [[ "$actual_commit" != "$BREEZE_COMMIT" ]]; then
            echo "Expected Breeze $BREEZE_COMMIT, fetched $actual_commit" >&2
            exit 1
          fi

          git -C "$breeze_repo" ls-tree -r --name-only FETCH_HEAD > "$breeze_tree"
          test -s "$breeze_tree"

      - name: Audit KDE Breeze icon names
        run: |
          set -Eeuo pipefail
          python3 tools/audit-breeze-icon-names.py \
            --tree-list "$RUNNER_TEMP/breeze-tree.txt" \
            --shared-mime-resolved "$RUNNER_TEMP/shared-mime-resolved.txt"

      - name: Audit Flathub application IDs
        run: |
          set -Eeuo pipefail
          python3 tools/audit-flathub-app-ids.py

      - name: Audit official Arch desktop IDs
        run: |
          set -Eeuo pipefail
          python3 tools/audit-arch-desktop-ids.py

      - name: Audit official Arch command names
        run: |
          set -Eeuo pipefail
          python3 tools/audit-arch-command-names.py

      - name: Audit Stage-G application provenance
        run: |
          set -Eeuo pipefail
          python3 tools/audit-application-provenance.py
