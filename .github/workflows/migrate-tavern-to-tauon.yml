name: Migrate Tavern icon slot to Tauon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrate-tavern-to-tauon.yml'

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    name: Replace W3-178 with Tauon
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Verify Tauon identities in pinned snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx 'com.github.taiko2k.tauonmb' design/icons/standards/flathub-app-ids-2026-09-14.csv
          grep -Fx 'tauonmb,extra' design/icons/standards/arch-desktop-ids-2026-09-14.csv

      - name: Replace Tavern slot with Tauon
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path('design/icons/matrix/witcher-icon-matrix-v1.csv')
          with path.open('r', encoding='utf-8-sig', newline='') as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames
              rows = [dict(row) for row in reader]

          if fieldnames is None:
              raise SystemExit('Matrix has no CSV header')

          matches = [row for row in rows if row['id'].strip() == 'W3-178']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one W3-178 row, found {len(matches)}')

          row = matches[0]
          if row['group'].strip() != 'Applications' or row['canonical_name'].strip() != 'tavern':
              raise SystemExit(f'Unexpected W3-178 source row: {row!r}')

          row['canonical_name'] = 'tauonmb'
          row['witcher_concept'] = 'Black alchemical record disc with opposing amber-red and cyan-violet quarter sigils'
          row['aliases'] = 'com.github.taiko2k.tauonmb'
          row['notes'] = ''

          with path.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

          # CSV is the source of truth; regenerate the Markdown mirror deterministically.
          python3 tools/normalize-icon-matrix.py --write

      - name: Remove resolved provenance row
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path('design/icons/standards/application-provenance-review.csv')
          with path.open('r', encoding='utf-8-sig', newline='') as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames
              rows = [dict(row) for row in reader]

          if fieldnames is None:
              raise SystemExit('Provenance CSV has no header')

          removed = [row for row in rows if row['id'].strip() == 'W3-178']
          if len(removed) != 1 or removed[0]['canonical_name'].strip() != 'tavern':
              raise SystemExit(f'Expected one unresolved Tavern provenance row, found {removed!r}')

          rows = [row for row in rows if row['id'].strip() != 'W3-178']
          with path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Update pinned identity coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tools/audit-flathub-app-ids.py'): {
                  'EXPECTED_ROWS_WITH_FLATHUB_ALIAS = 126': 'EXPECTED_ROWS_WITH_FLATHUB_ALIAS = 127',
                  'EXPECTED_EXACT_FLATHUB_ALIASES = 126': 'EXPECTED_EXACT_FLATHUB_ALIASES = 127',
                  'EXPECTED_ROWS_WITHOUT_FLATHUB = 94': 'EXPECTED_ROWS_WITHOUT_FLATHUB = 93',
              },
              Path('tools/audit-arch-desktop-ids.py'): {
                  'EXPECTED_CANONICAL_ARCH_ROWS = 59': 'EXPECTED_CANONICAL_ARCH_ROWS = 60',
                  'EXPECTED_ANY_ARCH_ROWS = 125': 'EXPECTED_ANY_ARCH_ROWS = 126',
                  'EXPECTED_COMBINED_ROWS = 174': 'EXPECTED_COMBINED_ROWS = 175',
                  'EXPECTED_UNRESOLVED_ROWS = 46': 'EXPECTED_UNRESOLVED_ROWS = 45',
              },
              Path('tools/audit-arch-command-names.py'): {
                  'EXPECTED_STAGE_E_UNRESOLVED = 46': 'EXPECTED_STAGE_E_UNRESOLVED = 45',
                  'EXPECTED_UNRESOLVED_ROWS = 28': 'EXPECTED_UNRESOLVED_ROWS = 27',
                  'EXPECTED_COMBINED_ROWS = 192': 'EXPECTED_COMBINED_ROWS = 193',
              },
              Path('tools/audit-application-provenance.py'): {
                  'EXPECTED_PROVENANCE_ROWS = 28': 'EXPECTED_PROVENANCE_ROWS = 27',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate migration before commit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/validate-icon-matrix.py
          python3 tools/normalize-icon-matrix.py
          python3 tools/audit-flathub-app-ids.py
          python3 tools/audit-arch-desktop-ids.py
          python3 tools/audit-arch-command-names.py
          python3 tools/audit-application-provenance.py

      - name: Verify exact migration result
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          matrix = Path('design/icons/matrix/witcher-icon-matrix-v1.csv')
          with matrix.open('r', encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          row = next(row for row in rows if row['id'].strip() == 'W3-178')
          assert row['canonical_name'].strip() == 'tauonmb', row
          assert row['aliases'].strip() == 'com.github.taiko2k.tauonmb', row
          assert 'Tavern signboard' not in row['witcher_concept'], row

          provenance = Path('design/icons/standards/application-provenance-review.csv')
          with provenance.open('r', encoding='utf-8-sig', newline='') as handle:
              review = list(csv.DictReader(handle))
          assert all(row['id'].strip() != 'W3-178' for row in review)
          assert len(review) == 27, len(review)
          PY

      - name: Verify change scope
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"

          cat > "$expected" <<'EOF'
          design/icons/matrix/witcher-icon-matrix-v1.csv
          design/icons/matrix/witcher-icon-matrix-v1.md
          design/icons/standards/application-provenance-review.csv
          tools/audit-application-provenance.py
          tools/audit-arch-command-names.py
          tools/audit-arch-desktop-ids.py
          tools/audit-flathub-app-ids.py
          EOF

          git diff --name-only | sort > "$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"

      - name: Commit Tauon replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            design/icons/matrix/witcher-icon-matrix-v1.csv \
            design/icons/matrix/witcher-icon-matrix-v1.md \
            design/icons/standards/application-provenance-review.csv \
            tools/audit-flathub-app-ids.py \
            tools/audit-arch-desktop-ids.py \
            tools/audit-arch-command-names.py \
            tools/audit-application-provenance.py
          git commit -m 'Replace Tavern icon slot with Tauon'
          git push origin HEAD:main

      - name: Dispatch full icon validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run icon-matrix.yml --ref main
